name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: syntax check
        run: python -m py_compile tp_kbd_backlight.py
      - name: install pyflakes
        run: pip install pyflakes
      - name: pyflakes
        run: pyflakes tp_kbd_backlight.py
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck install.sh uninstall.sh
